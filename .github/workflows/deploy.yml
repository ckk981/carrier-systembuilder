name: Deploy to GitHub Pages

# Trigger on pushes to main branch and allow manual dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency controls to prevent simultaneous deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          # Copy static HTML, JS, JSON files
          cp *.html _site/ 2>/dev/null || true
          cp *.js _site/ 2>/dev/null || true
          cp *.json _site/ 2>/dev/null || true
          # Copy images directory
          cp -r images _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the prepared static files
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
